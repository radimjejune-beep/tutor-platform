<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lessonfold · админка</title>
<style>
@font-face{font-family:"Inter";src:url(/assets/inter-regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url(/assets/inter-medium.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Inter";src:url(/assets/inter-semibold.woff) format("woff");font-weight:600 900;font-display:swap}
@font-face{font-family:"LF Serif";src:url(/assets/lf-serif.woff) format("woff");font-weight:400 700;font-display:swap;size-adjust:88%}
@font-face{font-family:"LF Serif";src:url(/assets/lf-serif-italic.woff) format("woff");font-weight:400 700;font-style:italic;font-display:swap;size-adjust:88%}
:root{--bg:#f3f1ec;--panel:#fdfcfa;--ink:#151515;--muted:#7d7c77;--line:#e8e5de;--amber:#151515;--ok:#3d6b55;--bad:#9c4a40;--warn:#83734f;--warn-bg:#f3efe6;--sel:#f0eee8;--f:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f)}
h1,h2,h3{font-family:"LF Serif",Georgia,serif;font-weight:600;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
label.inline input{width:auto}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn.main{background:var(--amber);border-color:var(--amber);color:#151515}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .l{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top h1{font-size:17px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--panel)}
.top .r{display:flex;gap:10px;align-items:center}
.dirty{font-weight:600;color:var(--warn);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:22px 20px 80px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--bg)}
.item.on{background:var(--sel);border-color:var(--line)}
.item b{display:block}
.item small{color:var(--muted)}
.pill{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);align-self:start}
.pill.available{color:var(--ok);border-color:currentColor}
.pill.preorder{color:var(--warn);border-color:currentColor}
.pill.hidden{opacity:.6}
.group{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c6{grid-column:span 6}.c4{grid-column:span 4}
@media(max-width:700px){.form{grid-template-columns:1fr}.c2,.c3,.c4,.c6{grid-column:auto}}
.sec{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-family:"LF Serif",Georgia,serif;font-weight:600;font-size:14px}
.file{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border:1.5px dashed var(--line);border-radius:6px}
.file .name{flex:1;min-width:160px}
.file .name b{display:block}
.file .name small{color:var(--muted)}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-weight:500}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.shot{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.shot img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#151515}
.shot .b{padding:8px;display:flex;flex-direction:column;gap:6px}
.shot .row{display:flex;gap:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.errors{border:1.5px solid var(--bad);color:var(--bad);border-radius:6px;padding:12px 14px;margin-bottom:16px}
.errors ul{margin:6px 0 0;padding-left:20px}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.help{color:var(--muted);font-size:13px;font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi div{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font:600 24px/1.1 "LF Serif",Georgia,serif;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-weight:500}

/* ---------- стиль платформы Lessonfold ---------- */
h1,h2,h3{font-family:"LF Serif",Georgia,serif;font-weight:500;letter-spacing:-.01em}
.top h1{font-size:24px}
.btn{font-weight:500}
.btn.main{color:#fff}
.btn.main:hover{background:#000;border-color:#000}
.tabs button{font-weight:500}
.sec{font-family:"Inter",system-ui,sans-serif;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label{font-weight:500}
.kpi b{font-family:"LF Serif",Georgia,serif;font-weight:500}
.item small.ok{color:var(--ok)}
.item small.bad{color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt; const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 3200) };
async function api(path, opts = {}) {
  const r = await fetch("/admin/api" + path, { ...opts, headers: { "x-lf-admin": "1", ...(opts.json !== undefined ? { "content-type": "application/json" } : {}), ...(opts.headers || {}) }, body: opts.json !== undefined ? JSON.stringify(opts.json) : opts.body, credentials: "same-origin" });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/login") { state.me = null; render(); throw new Error(data.error || "Нужно войти") }
  if (!r.ok) { const e = new Error(data.error || "Ошибка " + r.status); e.data = data; throw e }
  return data;
}
const STATUS = { available: "В продаже", preorder: "Предзаказ", soon: "Готовится", hidden: "Скрыт" };
const state = { me: null, tab: "orders", cat: null, files: {}, sel: null, dirty: false, errors: [], warnings: {}, facts: {}, version: null, baseline: null, remote: null, conflicts: null };

function djb(s) { let h = 5381; for (const c of String(s)) h = (h * 33 + c.charCodeAt(0)) >>> 0; return h.toString(36) }
function markDirty() { state.dirty = true; $("#dirty") && ($("#dirty").textContent = "Есть неопубликованные изменения") }
window.addEventListener("beforeunload", e => { if (state.dirty) { e.preventDefault(); e.returnValue = "" } });

async function boot() {
  try { state.me = await api("/me") } catch (e) { state.me = null }
  if (state.me) await loadCatalog();
  render();
}
async function loadCatalog() {
  const r = await api("/catalog");
  state.cat = r.catalog; state.files = r.files; state.dirty = false;
  state.version = r.version; state.baseline = JSON.parse(JSON.stringify(r.catalog)); state.remote = null; state.conflicts = null;
}
// Раз в минуту проверяем, не опубликовал ли каталог другой администратор
setInterval(async () => {
  if (!state.me || !state.version || document.hidden) return;
  try {
    const v = await api("/catalog/version");
    if (v.version === state.version) return;
    if (!state.dirty) { await loadCatalog(); if (["lessons", "books"].includes(state.tab)) render(); toast(`Каталог обновлён: изменения от ${v.by || "другого администратора"}`); }
    else { state.remote = v; const b = $("#remote"); if (b) b.outerHTML = remoteBox(); else if (["lessons", "books"].includes(state.tab)) render(); }
  } catch (e) {}
}, 60000);
const remoteBox = () => state.remote ? `<div class="warn" id="remote" style="margin-bottom:14px">${esc(state.remote.by || "Другой администратор")} опубликовал изменения${state.remote.at ? " в " + new Date(state.remote.at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : ""}. Ваши правки можно опубликовать как обычно: если вы правили разные уроки, всё сохранится вместе.</div>` : '<span id="remote" hidden></span>';

function render() {
  const app = $("#app");
  if (!state.me) {
    app.innerHTML = `<form class="login panel" id="lf"><h1>Lessonfold</h1><p class="muted">Вход для администраторов</p>
      <label>Логин<input id="lg" autocomplete="username" required></label>
      <label>Пароль<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn main" type="submit">Войти</button><p class="bad" id="lerr"></p></form>`;
    $("#lf").onsubmit = async e => { e.preventDefault();
      try { await api("/login", { method: "POST", json: { login: $("#lg").value, password: $("#pw").value } }); await boot() }
      catch (err) { $("#lerr").textContent = err.message } };
    return;
  }
  const tabs = [["orders", "Заказы"], ["lessons", "Уроки"], ["books", "Учебники"], ["settings", "Реквизиты и ссылки"], ["admins", "Администраторы"], ["stats", "Статистика"], ["authors", "Авторы"]];
  app.innerHTML = `<div class="top"><div class="l"><h1>Lessonfold</h1><div class="tabs">${tabs.map(([k, t]) => `<button data-t="${k}" class="${state.tab === k ? "on" : ""}">${t}</button>`).join("")}</div></div>
    <div class="r"><span class="dirty" id="dirty">${state.dirty ? "Есть неопубликованные изменения" : ""}</span><button class="btn main" id="pub">Опубликовать</button><a class="btn" href="/" target="_blank">Сайт</a><button class="btn" id="out">Выйти (${esc(state.me.login)})</button></div></div><main id="m"></main>`;
  $(".tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.tab = b.dataset.t; render() };
  $("#out").onclick = async () => { await api("/logout", { method: "POST", json: {} }); state.me = null; render() };
  $("#pub").onclick = publish;
  $("#pub").hidden = !["lessons", "books"].includes(state.tab);
  ({ orders: renderOrders, lessons: renderLessons, books: renderBooks, settings: renderSettings, admins: renderAdmins, stats: renderStats, authors: renderAuthors })[state.tab]();
}

async function publish() {
  const btn = $("#pub"); btn.disabled = true;
  try {
    const clean = JSON.parse(JSON.stringify(state.cat));
    for (const p of Object.values(clean.products)) { delete p._new; delete p.sku }
    // Что поменял именно этот админ: сервер наложит только это, если каталог уже обновил коллега
    const base = state.baseline || { products: {}, textbooks: [] };
    const changed = Object.keys(clean.products).filter(k => JSON.stringify(base.products[k]) !== JSON.stringify(clean.products[k]));
    const deleted = Object.keys(base.products).filter(k => !(k in clean.products));
    const books = JSON.stringify(base.textbooks) !== JSON.stringify(clean.textbooks);
    const baseHashes = { __books: djb(JSON.stringify(base.textbooks || [])) };
    for (const k of [...changed, ...deleted]) if (base.products[k]) baseHashes[k] = djb(JSON.stringify(base.products[k]));
    const r = await api("/catalog", { method: "PUT", json: { catalog: clean, base: state.version, changed, deleted, books, baseHashes } });
    state.errors = []; state.dirty = false; state.conflicts = null;
    toast(r.merged ? "Опубликовано вместе с правками другого администратора." : "Опубликовано. Сайт и бот уже видят изменения.");
    await loadCatalog(); render();
  } catch (e) {
    if (e.data && e.data.conflicts) { state.conflicts = e.data; state.errors = [] }
    else state.errors = (e.data && e.data.errors) || [e.message];
    render(); window.scrollTo(0, 0);
  }
  finally { btn.disabled = false }
}
const errorsBox = () => (state.conflicts ? `<div class="errors"><b>Не опубликовано: ${esc(state.conflicts.by || "другой администратор")} уже изменил${state.conflicts.at ? " в " + new Date(state.conflicts.at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : ""} то же самое:</b><ul>${state.conflicts.conflicts.map(x => `<li>${esc(x)}</li>`).join("")}</ul><p style="margin:10px 0 0">Чтобы не затереть его работу, перепишите себе свои правки по этим урокам, нажмите «Загрузить свежий каталог» и внесите их снова.</p><div class="actions"><button class="btn dark" id="reloadCat">Загрузить свежий каталог</button></div></div>` : "")
  + (state.errors.length ? `<div class="errors"><b>Не опубликовано. Исправьте:</b><ul>${state.errors.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "") + (["lessons", "books"].includes(state.tab) ? remoteBox() : "");
document.addEventListener("click", async e => { if (e.target && e.target.id === "reloadCat") { await loadCatalog(); state.errors = []; render(); toast("Загружен свежий каталог") } });

/* ---------- уроки ---------- */
function renderLessons() {
  const c = state.cat, m = $("#m");
  const prods = Object.entries(c.products || {}).map(([sku, p]) => ({ ...p, sku })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
  const groups = c.textbooks.map(t => [t, prods.filter(p => p.book === t.id)]);
  const orphan = prods.filter(p => !c.textbooks.some(t => t.id === p.book));
  const item = p => { const miss = missing(p); return `<div class="item ${state.sel === p.sku ? "on" : ""}" data-s="${esc(p.sku)}"><div><b>${esc(p.title || "Без названия")}</b><small>${esc(p.sku)} · ${p.scope === "course" ? "курс" : p.type === "pack" ? "пакет" : "урок"}${p.free ? " · бесплатный" : p.price ? " · " + p.price + " ₽" : ""}${p.author ? " · " + esc(p.author) : ""}</small><small class="${miss.length ? "bad" : "ok"}" style="display:block">${miss.length ? "Не хватает: " + miss.join(", ") : "Всё готово к продаже"}</small>${p.editedBy ? `<small style="display:block">изменил ${esc(p.editedBy)}, ${when(p.editedAt)}</small>` : ""}</div><span class="pill ${p.status}">${STATUS[p.status] || p.status}</span></div>` };
  m.innerHTML = errorsBox() + `<div class="grid2"><div class="panel"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button class="btn sm dark" id="addL">+ Урок</button><button class="btn sm" id="addP">+ Пакет</button><button class="btn sm" id="addC">+ Курс на год</button></div>
    <div class="list" id="lst">${groups.map(([t, ps]) => `<div class="group">${esc(t.title)}</div>${ps.map(item).join("") || '<p class="help" style="padding:0 12px">Пока пусто</p>'}`).join("")}${orphan.length ? `<div class="group">Без учебника</div>${orphan.map(item).join("")}` : ""}</div></div>
    <div class="panel" id="ed">${state.sel && c.products[state.sel] ? "" : '<p class="muted">Выберите урок слева или добавьте новый. Изменения появятся на сайте и в боте после кнопки «Опубликовать».</p>'}</div></div>`;
  $("#lst").onclick = e => { const it = e.target.closest(".item"); if (!it) return; state.sel = it.dataset.s; renderLessons() };
  $("#addL").onclick = () => addProduct("lesson");
  $("#addP").onclick = () => addProduct("pack");
  if ($("#addC")) $("#addC").onclick = () => { addProduct("pack"); const p = state.cat.products[state.sel]; if (p) { p.scope = "course"; p.short = "Весь курс"; renderEditor(state.sel); renderLessons() } };
  if (state.sel && c.products[state.sel]) renderEditor(state.sel);
}
// Чего не хватает, чтобы товар можно было продавать
function missing(p) {
  const m = [];
  const has = kind => { const r = p.files && p.files[kind]; return !!(r && (!r.startsWith("db:") || state.files[r.slice(3)])) };
  if (!(p.name || p.title)) m.push("название");
  if (!p.description) m.push("описание");
  if (!p.free && !(p.price > 0)) m.push("цена");
  if (p.type === "lesson") {
    if (!has("html")) m.push("HTML");
    if (!has("pdf")) m.push("PDF");
    if (!(p.shots || []).length) m.push("скриншоты");
    if (!p.author) m.push("автор");
  } else if (p.scope !== "course" && !(p.includes || []).length) m.push("уроки в пакете");
  return m;
}
const when = iso => iso ? new Date(iso).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b > 1 && b < 5 ? few : b === 1 ? one : many };
// Копия урока: те же учебник, модуль, цена и автор, без файлов
function copyProduct(sku) {
  const src = state.cat.products[sku];
  const nsku = "new-" + Math.random().toString(36).slice(2, 7);
  const c = JSON.parse(JSON.stringify(src));
  delete c.files; delete c.shots; delete c.editedBy; delete c.editedAt; delete c.fileName;
  Object.assign(c, { title: (src.title || "") + " (копия)", name: src.name ? src.name + " (копия)" : "", status: "soon", free: false, files: {}, shots: [], order: Object.keys(state.cat.products).length, _new: true });
  if (c.type === "lesson") c.unit = "";
  state.cat.products[nsku] = c; state.sel = nsku; markDirty(); renderLessons(); toast("Копия создана. Поменяйте название и код, загрузите файлы.");
}
function fileState(p) {
  if (p.type !== "lesson") return "";
  const h = p.files && p.files.html, ok = h && (!h.startsWith("db:") || state.files[h.slice(3)]);
  return ok ? " · HTML ✓" : " · нет HTML";
}
function addProduct(type) {
  const sku = "new-" + Math.random().toString(36).slice(2, 7);
  const book = (state.cat.textbooks[0] || {}).id || "";
  state.cat.products[sku] = { type, title: "", short: "", description: "", status: "soon", price: 0, book, grade: "", moduleTitle: "", unit: "", meta: [], files: {}, shots: [], includes: [], order: Object.keys(state.cat.products).length, _new: true };
  state.sel = sku; markDirty(); renderLessons();
}
function renameSku(oldSku, newSku) {
  const c = state.cat;
  if (oldSku === newSku) return true;
  if (!/^[a-z0-9][a-z0-9-]{1,40}$/.test(newSku)) { toast("Код: латиница в нижнем регистре, цифры и дефис, например sp5-2b"); return false }
  if (c.products[newSku]) { toast("Такой код уже есть"); return false }
  const p = c.products[oldSku];
  if (!p._new) { toast("Код опубликованного товара менять нельзя: он уже мог попасть в покупки."); return false }
  delete c.products[oldSku]; c.products[newSku] = p;
  for (const x of Object.values(c.products)) if (x.includes) x.includes = x.includes.map(s => s === oldSku ? newSku : s);
  state.sel = newSku; return true;
}

function renderEditor(sku) {
  const c = state.cat, p = c.products[sku], ed = $("#ed");
  const lessons = Object.entries(c.products).filter(([k, x]) => x.type === "lesson" && k !== sku);
  const books = c.textbooks.map(t => `<option value="${esc(t.id)}" ${p.book === t.id ? "selected" : ""}>${esc(t.title)}</option>`).join("");
  const st = Object.entries(STATUS).filter(([k]) => p.type === "pack" || k !== "preorder").map(([k, v]) => `<option value="${k}" ${p.status === k ? "selected" : ""}>${v}</option>`).join("");

function fileRow(sku, kind, label, accept) {
  const p = state.cat.products[sku];
  const ref = p.files && p.files[kind];
  const info = ref && ref.startsWith("db:") ? state.files[ref.slice(3)] : null;
  const w = state.warnings[sku + kind];
  return `<div class="file"><div class="name"><b>${label}</b>${info ? `<small class="ok">Загружен ${new Date(info.updated_at).toLocaleString("ru-RU")}, ${Math.round(info.size / 1024)} КБ${info.updated_by ? ", " + esc(info.updated_by) : ""}</small>` : ref ? `<small>${esc(ref)}</small>` : `<small class="bad">Не загружен</small>`}</div>
    ${info ? `<a class="btn sm" href="/admin/api/files/${encodeURIComponent(ref.slice(3))}" target="_blank">Открыть</a>` : ""}
    <label class="btn sm dark" style="display:inline-flex;flex-direction:row;color:var(--panel)">${info ? "Заменить" : "Загрузить"}<input type="file" data-kind="${kind}" accept="${accept}" hidden></label>
    ${ref ? `<button class="btn sm danger" data-rm="${kind}">Убрать</button>` : ""}</div>${w ? `<div class="warn">${w.map(esc).join("<br>")}</div>` : ""}`;
}
function renderFiles(sku) {
  const box = $("#filesBox");
  const p = state.cat.products[sku], f = state.facts[sku];
  let sugg = "";
  if (f) {
    const lines = [...(p.meta || [])];
    const put = (re, text) => { const i = lines.findIndex(l => re.test(l)); if (i >= 0) lines[i] = text; else lines.push(text) };
    if (f.screens) put(/экран/i, `${f.screens} ${plural(f.screens, "экран", "экрана", "экранов")}`);
    if (f.audio) put(/аудио/i, `${f.audio} аудио`);
    if (f.pages) put(/PDF/i, `${f.pages} ${plural(f.pages, "страница", "страницы", "страниц")} PDF`);
    if (JSON.stringify(lines) !== JSON.stringify(p.meta || [])) sugg = `<div class="warn" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px"><span style="flex:1;min-width:200px">В файлах: ${lines.filter(l => /экран|аудио|PDF/i.test(l)).map(esc).join(", ")}. В карточке сейчас: ${(p.meta || []).map(esc).join(", ") || "пусто"}.</span><button class="btn sm dark" id="putFacts">Подставить в карточку</button></div>`;
    state.factLines = lines;
  }
  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">${fileRow(sku, "html", "HTML-урок (собран с меткой {{BUYER}})", ".html,text/html")}${fileRow(sku, "pdf", "PDF для учителя", ".pdf,application/pdf")}</div>${sugg}<p class="help" style="margin-top:8px">Имя файла у покупателя: ${esc(p.fileName || autoName(p))}.html</p>`;
  if ($("#putFacts")) $("#putFacts").onclick = () => { p.meta = state.factLines; markDirty(); renderEditor(sku); toast("Факты подставлены. Нажмите «Опубликовать».") };
  box.querySelectorAll("input[type=file]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const kind = inp.dataset.kind;
    const key = `lesson/${sku}/${kind}`;
    const mime = kind === "pdf" ? "application/pdf" : "text/html; charset=utf-8";
    toast("Загружаю " + f.name + "…");
    try {
      const r = await api("/files/" + encodeURIComponent(key), { method: "PUT", body: f, headers: { "content-type": mime } });
      const p = state.cat.products[sku]; p.files = p.files || {}; p.files[kind] = "db:" + key; p.fileName = p.fileName || autoName(p);
      state.files[key] = { size: r.size, updated_at: new Date().toISOString(), updated_by: state.me.login };
      state.warnings[sku + kind] = r.warnings && r.warnings.length ? r.warnings : null;
      if (r.facts) state.facts[sku] = { ...(state.facts[sku] || {}), ...r.facts };
      markDirty(); toast("Файл загружен. Нажмите «Опубликовать», чтобы он ушёл в продажу."); renderFiles(sku);
    } catch (e) { toast(e.message) }
  });
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { delete state.cat.products[sku].files[b.dataset.rm]; markDirty(); renderFiles(sku) });
}
function autoName(p) { return (p.title || p.sku || "lesson").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || "Lessonfold_lesson" }

function renderShots(sku) {
  const p = state.cat.products[sku]; p.shots = p.shots || [];
  const box = $("#shots");
  box.innerHTML = p.shots.map((s, i) => `<div class="shot"><img src="${s.file && s.file.startsWith("db:") ? "/f/" + esc(s.file.slice(3)) + "?v=" + (state.files[s.file.slice(3)] || {}).sha : ""}" alt=""><div class="b"><input data-cap="${i}" value="${esc(s.caption || "")}" placeholder="Подпись: что на экране"><div class="row"><button class="btn sm" data-up="${i}" ${i ? "" : "disabled"}>←</button><button class="btn sm" data-dn="${i}" ${i < p.shots.length - 1 ? "" : "disabled"}>→</button><button class="btn sm danger" data-x="${i}">Убрать</button></div></div></div>`).join("") || '<p class="help">Скриншотов пока нет. Без них урок показывается на сайте компактной строкой.</p>';
  box.querySelectorAll("[data-cap]").forEach(inp => inp.oninput = () => { p.shots[+inp.dataset.cap].caption = inp.value; markDirty() });
  const mv = (i, d) => { const s = p.shots.splice(i, 1)[0]; p.shots.splice(i + d, 0, s); markDirty(); renderShots(sku) };
  box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => mv(+b.dataset.up, -1));
  box.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => mv(+b.dataset.dn, 1));
  box.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { p.shots.splice(+b.dataset.x, 1); markDirty(); renderShots(sku) });
  $("#shotIn").onchange = async e => {
    for (const f of e.target.files) {
      try {
        const blob = await toWebp(f);
        const key = `shot/${sku}/${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
        const r = await api("/files/" + encodeURIComponent(key), { method: "PUT", body: blob, headers: { "content-type": "image/webp" } });
        state.files[key] = { size: r.size, sha: r.sha, updated_at: new Date().toISOString() };
        p.shots.push({ file: "db:" + key, caption: f.name.replace(/\.[^.]+$/, "") });
        markDirty(); renderShots(sku);
      } catch (err) { toast(f.name + ": " + err.message) }
    }
  };
}
function toWebp(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const k = Math.min(1, 1600 / img.width); const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); cv.toBlob(b => b ? res(b) : rej(new Error("Не удалось сжать картинку")), "image/webp", 0.82); URL.revokeObjectURL(img.src) };
    img.onerror = () => rej(new Error("Это не картинка")); img.src = URL.createObjectURL(file);
  });
}

  state.oq = q;
  const ready = await api("/ready").catch(() => ({ seller: true }));
  const warn = [!ready.seller ? "Продажи закрыты: заполните во вкладке «Реквизиты и ссылки» ФИО полностью, ИНН и почту или Telegram для претензий. Без этих сведений продавать нельзя по закону о защите прав потребителей." : "", !r.pay ? "Оплата на сайте выключена: задайте YOOKASSA_SHOP_ID и YOOKASSA_SECRET_KEY." : "", !r.mail ? "Почта не настроена: письма покупателям не уходят, ссылку на заказ можно скопировать и отправить вручную." : ""].filter(Boolean);
  m.innerHTML = `${warn.map(w => `<div class="warn" style="margin-bottom:12px">${esc(w)}</div>`).join("")}<div class="panel">
    <form id="oqf" style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap"><input id="oq" value="${esc(q)}" placeholder="Почта или номер заказа" style="max-width:340px"><button class="btn dark" type="submit">Найти</button></form>
    <div style="overflow-x:auto"><table><thead><tr><th>Дата</th><th>Заказ</th><th>Почта</th><th>Урок</th><th>Сумма</th><th>Статус</th><th>Письмо</th><th></th></tr></thead><tbody>
    ${r.orders.map(o => { const st = OST[o.status] || [o.status, ""]; return `<tr>
      <td class="muted" style="white-space:nowrap">${new Date(o.paid_at || o.created_at).toLocaleString("ru-RU")}</td>
      <td><b>${esc(o.id.slice(0, 8).toUpperCase())}</b>${o.note ? `<br><small class="bad">${esc(o.note)}</small>` : ""}</td>
      <td>${esc(o.email)}${o.news ? '<br><small class="muted">подписан на новости</small>' : ""}</td>
      <td>${esc(o.title)}</td><td style="white-space:nowrap">${o.amount_rub} ₽</td>
      <td><span class="pill ${st[1]}">${st[0]}</span></td>
      <td>${o.status === "paid" ? (o.emailed_at ? '<span class="ok">ушло</span>' : `<span class="bad">не ушло</span>${o.mail_error ? `<br><small class="muted">${esc(o.mail_error)}</small>` : ""}`) : ""}${o.opened ? `<br><small class="muted">скачиваний: ${o.opened}</small>` : ""}</td>
      <td style="white-space:nowrap">${o.status === "paid" ? `<button class="btn sm" data-a="resend" data-id="${o.id}">Отправить ссылку</button> <button class="btn sm" data-a="link" data-id="${o.id}">Ссылка</button> <button class="btn sm danger" data-a="refund" data-id="${o.id}">Возврат</button>` : o.status === "pending" ? `<button class="btn sm" data-a="sync" data-id="${o.id}">Проверить оплату</button>` : ""}</td></tr>` }).join("") || '<tr><td colspan="8" class="muted">Заказов пока нет</td></tr>'}
    </tbody></table></div><p class="help">После возврата аннулируйте чек в приложении «Мой налог»: Продажи → чек → Аннулировать → «Возврат средств».</p></div>`;
  $("#oqf").onsubmit = e => { e.preventDefault(); renderOrders($("#oq").value.trim()) };
  m.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.a;
    try {
      if (a === "refund") {
        if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Вернуть деньги?"; return }
        await api(`/orders/${id}/refund`, { method: "POST", json: {} }); toast("Возврат отправлен в ЮKassa. Не забудьте аннулировать чек."); return renderOrders();
      }
      if (a === "link") {
        const r = await api("/orders/link", { method: "POST", json: { id } });
        try { await navigator.clipboard.writeText(r.link); toast("Ссылка скопирована") } catch (e) { prompt("Ссылка на заказ", r.link) }
        return;
      }
      if (a === "resend") { await api(`/orders/${id}/resend`, { method: "POST", json: {} }); toast("Письмо отправлено"); return renderOrders() }
      if (a === "sync") { const r = await api(`/orders/${id}/sync`, { method: "POST", json: {} }); toast("Статус: " + (OST[r.order.status] || [r.order.status])[0]); return renderOrders() }
    } catch (e) { toast(e.message) }
  });
}

/* ---------- авторы ---------- */
async function renderAuthors(month) {
  const m = $("#m");
  month = month || state.am || new Date().toISOString().slice(0, 7);
  state.am = month;
  const r = await api("/authors?month=" + month);
  const rub = n => Number(n).toLocaleString("ru-RU") + " ₽";
  const months = []; const d = new Date(); d.setDate(1);
  for (let i = 0; i < 12; i++) { months.push(d.toISOString().slice(0, 7)); d.setMonth(d.getMonth() - 1) }
  const name = ym => new Date(ym + "-01T12:00:00").toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
  m.innerHTML = `<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px">
    <label style="max-width:240px">Месяц<select id="am">${months.map(x => `<option value="${x}" ${x === month ? "selected" : ""}>${name(x)}</option>`).join("")}</select></label>
    <button class="btn" id="csv" ${r.authors.length ? "" : "disabled"}>Скачать таблицу (CSV)</button></div>
    <div class="kpi"><div><b>${rub(r.total)}</b><small>оплачено за месяц</small></div><div><b>${r.count}</b><small>покупок</small></div><div><b>${r.authors.length}</b><small>авторов с продажами</small></div></div>
    ${r.authors.map(a => `<h3 style="font-size:18px;margin:18px 0 8px">${esc(a.author)}: ${rub(a.rub)}</h3><table><thead><tr><th>Урок</th><th>Продаж</th><th>Выручка</th></tr></thead><tbody>${a.items.map(i => `<tr><td>${esc(i.title)}</td><td>${i.n}</td><td>${rub(i.rub)}</td></tr>`).join("")}</tbody></table>`).join("") || '<p class="muted">В этом месяце продаж не было.</p>'}
    <p class="help" style="margin-top:16px">Автор берётся из поля «Автор урока» в карточке. Пакет и курс делятся поровну между входящими в них уроками. Суммы без комиссии ЮKassa и налога. Отчёт можно приложить к договору с соавтором как основание для выплаты.</p></div>`;
  $("#am").onchange = e => renderAuthors(e.target.value);
  $("#csv").onclick = () => {
    const rows = [["Автор", "Урок", "Продаж", "Выручка, руб."]];
    for (const a of r.authors) for (const i of a.items) rows.push([a.author, i.title, String(i.n).replace(".", ","), i.rub]);
    const csv = "\ufeff" + rows.map(x => x.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = `lessonfold-avtory-${month}.csv`; a.click();
  };
}

/* ---------- статистика ---------- */
async function renderStats() {
  const m = $("#m");
  const { stats: s, site: w, log, bot } = await api("/stats");
  const k = (v, t) => `<div><b>${v}</b><small>${t}</small></div>`;
  const rubs = n => Number(n).toLocaleString("ru-RU") + " ₽";
  m.innerHTML = `<div class="panel"><h3 style="font-size:15px;margin-bottom:10px">Сайт</h3><div class="kpi">${k(w.paid, "оплаченных заказов")}${k(w.buyers, "покупателей")}${k(rubs(w.revenue), "выручка всего")}${k(rubs(w.revenue_30d), "за 30 дней")}${k(w.news, "подписаны на новости")}${k(w.pending, "ждут оплаты")}</div>
    ${bot ? `<h3 style="font-size:15px;margin-bottom:10px">Telegram-бот</h3><div class="kpi">${k(s.users, "пользователей бота")}${k(s.free_takers, "взяли бесплатный урок")}${k(s.payers, "покупателей")}${k(s.paid, "оплат")}${k(rubs(s.revenue), "выручка всего")}${k(rubs(s.revenue_30d), "за 30 дней")}</div>` : ""}
    <div class="grid2"><div><h3 style="font-size:15px;margin-bottom:8px">По товарам</h3><table><thead><tr><th>Код</th><th>Тип</th><th>Шт.</th><th>₽</th></tr></thead><tbody>${s.bySku.map(r => `<tr><td>${esc(r.sku)}</td><td>${esc(r.kind)}</td><td>${r.n}</td><td>${r.rub}</td></tr>`).join("")}</tbody></table>
    <h3 style="font-size:15px;margin:18px 0 8px">Откуда пришли</h3><table><tbody>${s.sources.map(r => `<tr><td>${esc(r.src)}</td><td>${r.n}</td></tr>`).join("")}</tbody></table></div>
    <div><h3 style="font-size:15px;margin-bottom:8px">Журнал действий админов</h3><table><tbody>${log.map(l => `<tr><td class="muted" style="white-space:nowrap">${new Date(l.at).toLocaleString("ru-RU")}</td><td><b>${esc(l.login || "")}</b> ${esc(l.action)}<br><small class="muted">${esc(l.detail || "")}</small></td></tr>`).join("")}</tbody></table></div></div></div>`;
}
boot();
</script>
</body>
</html>
